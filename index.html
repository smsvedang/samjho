<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Samjho — An AI that listens, understands and explains</title>
    
    <!-- Meta & SEO -->
    <meta name="description" content="Talk freely. Samjho listens, understands and explains — without needing to know who you are. No signup, no chat database, 100% private local AI companion." />

    <link rel="canonical" href="https://samjhoai.in" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samjhoai.in" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
